name: Artifacts Demo

on:
  push:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - run: echo "hello" > message.txt
      - uses: actions/upload-artifact@v4
        with:
          name: demo-artifact
          path: message.txt

  download:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: demo-artifact
      - run: cat demo-artifact/message.txt
